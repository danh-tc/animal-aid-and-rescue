# Môi trường dev. Chạy: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: aar-postgres
    environment:
      POSTGRES_DB: aar
      POSTGRES_USER: aar
      POSTGRES_PASSWORD: aar
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - aar-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aar -d aar"]
      interval: 5s
      timeout: 3s
      retries: 10

  # NFR-06: sao lưu hằng ngày bằng pg_dump vào ./backups, giữ BACKUP_KEEP_DAYS ngày gần nhất.
  # Khôi phục: scripts/restore.sh backups/<tệp>.dump
  backup:
    image: postgres:16-alpine
    container_name: aar-backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: aar
      PGUSER: aar
      PGPASSWORD: aar
      TZ: Asia/Ho_Chi_Minh
      BACKUP_AT: "02:00"
      BACKUP_KEEP_DAYS: "7"
    volumes:
      - ./backups:/backups
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["/bin/sh", "/backup-loop.sh"]

volumes:
  aar-pgdata:

spring:
  application:
    name: aar-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aar}
    username: ${DB_USERNAME:aar}
    password: ${DB_PASSWORD:aar}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    # Base64, tối thiểu 32 byte. Bắt buộc đặt qua biến môi trường JWT_SECRET khi chạy ngoài dev
    secret: ${JWT_SECRET:}
    expiration-minutes: 480
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  storage:
    # Thư mục lưu tệp đính kèm. Không commit thư mục này
    dir: ${STORAGE_DIR:./data/uploads}
    max-files-per-request: 5
  # Giới hạn tần suất /api/public/** theo IP, mỗi phút
  rate-limit:
    auth-per-minute: 10
    lookup-per-minute: 20
    report-per-minute: 10
    other-per-minute: 300
